services:
  zookeeper:
    image: fit3182/zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: fit3182/kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: ${HOST_IP}:2181
      KAFKA_ADVERTISED_HOST_NAME: ${HOST_IP}
    restart: unless-stopped

  mongodb:
    image: fit3182/mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  spark:
    image: fit3182/pyspark
    container_name: spark
    ports:
      - "8889:8888"
      - "4041:4040"
    volumes:
      - ./:/home/student
    working_dir: /home/student
    command: >
        sh -c "echo '👉 Open Jupyter Notebook at http://localhost:8889' &&
         jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''"

volumes:
  mongo_data: